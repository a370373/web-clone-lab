<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Clone Lab</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <main class="container">

    <h1>🧬 Web Clone Lab</h1>

    <p id="pageInfo">Detecting page...</p>

    <button id="cloneButton">
      🔬 Clone This Page
    </button>

    <div id="progress">
      <p>HTML <span id="htmlStatus">—</span></p>
      <p>CSS <span id="cssStatus">—</span></p>
      <p>JS <span id="jsStatus">—</span></p>
      <p>Assets <span id="assetStatus">—</span></p>
    </div>

    <p id="status">Ready.</p>

  </main>

  <script src="../vendor/jszip.min.js"></script>
  <script src="../core/builder.js"></script>
<script src="../core/resource-manager.js"></script>
<script src="../core/rewriter.js"></script>
  <script src="../core/resource-downloader.js"></script>
<script src="../core/css-scanner.js"></script>
<script src="../core/js-scanner.js"></script>
<script src="../core/zip.js"></script>
  <script src="popup.js"></script>

</body>
</html>
